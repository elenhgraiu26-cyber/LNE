<!DOCTYPE html>
<html lang="el" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitat Match (NestAI) - AI Lifestyle Real Estate</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full font-sans bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white flex flex-col items-center justify-center min-h-screen p-0 sm:p-4">

  <!-- Main Container / Mobile Device Frame -->
  <div id="appContainer" class="w-full max-w-[420px] h-[100vh] sm:h-[840px] bg-slate-900 sm:rounded-[48px] shadow-2xl shadow-indigo-950/50 border-0 sm:border-[10px] border-slate-800 relative flex flex-col overflow-hidden transition-all duration-500">
    
    <!-- Top Status / Header Bar -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-5 pt-4 pb-3 flex items-center justify-between z-30 shrink-0">
      <div class="flex items-center gap-2 cursor-pointer" onclick="goToScreen('feed')">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-brand-500/30">
          <i class="fa-solid fa-house-signal"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight text-white leading-tight">Habitat<span class="text-brand-500">Match</span></h1>
          <p class="text-[10px] text-slate-400 font-medium">NestAI Engine v2.4</p>
        </div>
      </div>

      <!-- Action Buttons Header -->
      <div class="flex items-center gap-2">
        <!-- Language Switcher -->
        <button onclick="toggleLanguage()" class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-xs font-bold text-brand-500 border border-slate-700 transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-globe text-[11px]"></i>
          <span id="langLabel">EN</span>
        </button>

        <!-- Admin Modal Trigger -->
        <button onclick="openAdminModal()" class="px-2.5 py-1 rounded-full bg-indigo-950/80 hover:bg-indigo-900 text-xs font-bold text-indigo-300 border border-indigo-700/50 transition-all flex items-center gap-1">
          <i class="fa-solid fa-shield-halved text-[11px]"></i>
          <span id="adminBtnLabel">Admin</span>
          <span id="pendingBadge" class="hidden bg-amber-500 text-slate-950 text-[10px] font-extrabold px-1.5 py-0.2 rounded-full ml-0.5">0</span>
        </button>
      </div>
    </header>

    <!-- Content Screen Area -->
    <main class="flex-1 overflow-y-auto relative bg-slate-950 pb-20 scrollbar-none" id="mainContent">

      <!-- ================= 1. ONBOARDING QUIZ ================= -->
      <section id="screen-quiz" class="p-5 flex flex-col justify-between min-h-full">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-500 text-xs font-semibold mb-4">
            <i class="fa-solid fa-sparkles"></i>
            <span data-i18n="quizBadge">AI Lifestyle Profiler</span>
          </div>
          <h2 class="text-2xl font-bold text-white mb-2 leading-tight" data-i18n="quizTitle">Βρες το σπίτι & τη γειτονιά που σου
